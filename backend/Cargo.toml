[package]
name = "backend"
version = "0.1.0"
edition = "2021"
authors = ["Pakistan Digital Health Platform Team"]
description = "Secure Digital Health Identity & Longitudinal Medical Record Backend"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
# ── Async Runtime ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Web Framework ──────────────────────────────────────────────
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "timeout"] }

# ── Database ───────────────────────────────────────────────────
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "migrate", "json"] }

# ── Serialization ──────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Authentication & Security ──────────────────────────────────
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

# ── Validation ─────────────────────────────────────────────────
validator = { version = "0.18", features = ["derive"] }

# ── Configuration ──────────────────────────────────────────────
dotenvy = "0.15"

# ── Error Handling ─────────────────────────────────────────────
thiserror = "1"
anyhow = "1"

# ── Logging & Tracing ─────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Time ───────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Random ────────────────────────────────────────────────────
rand = "0.8"
regex = "1"

# ── HTTP ──────────────────────────────────────────────────────
http = "1"
hyper = { version = "1", features = ["full"] }

[dev-dependencies]
# Test utilities
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
