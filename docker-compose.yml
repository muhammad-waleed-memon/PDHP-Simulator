services:
  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dhp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_health_platform}
      POSTGRES_USER: ${POSTGRES_USER:-dhp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhp_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhp_user} -d ${POSTGRES_DB:-digital_health_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dhp_network

  # ── Rust / Axum Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dhp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dhp_user}:${POSTGRES_PASSWORD:-dhp_password}@postgres:5432/${POSTGRES_DB:-digital_health_platform}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_IN_PRODUCTION_MIN_64_CHARACTERS}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      JWT_REFRESH_EXPIRES_IN_SECONDS: ${JWT_REFRESH_EXPIRES_IN_SECONDS:-604800}
      RUST_LOG: ${RUST_LOG:-info,backend=debug,sqlx=warn,tower_http=debug}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_access_key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_secret_key}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PATIENT_PASSWORD: ${DEMO_PATIENT_PASSWORD:-PatientDemo123!}
      DEMO_DOCTOR_PASSWORD: ${DEMO_DOCTOR_PASSWORD:-DoctorDemo123!}
      DEMO_LAB_PASSWORD: ${DEMO_LAB_PASSWORD:-LabUserDemo123!}
      DEMO_FACILITY_ADMIN_PASSWORD: ${DEMO_FACILITY_ADMIN_PASSWORD:-FacilityAdminDemo123!}
      DEMO_SYSTEM_ADMIN_PASSWORD: ${DEMO_SYSTEM_ADMIN_PASSWORD:-SysAdminDemo123!}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - dhp_network

  # ── React Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_FHIR_BASE_URL: ${VITE_FHIR_BASE_URL:-/fhir}
    container_name: dhp_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dhp_network

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: dhp_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dhp_network

  # ── MinIO Object Storage ──────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: dhp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_secret_key}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dhp_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  dhp_network:
    driver: bridge
